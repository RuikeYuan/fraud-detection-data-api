apiVersion: v1
kind: Namespace
metadata:
  name: fraud-detection
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-api
  namespace: fraud-detection
  labels:
    app: fraud-detection
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection
      component: api
  template:
    metadata:
      labels:
        app: fraud-detection
        component: api
    spec:
      containers:
        - name: api
          image: __ACR_LOGIN_SERVER__/fraud-detection:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /heterodata
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /heterodata
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fraud-detection
  labels:
    app: fraud-detection
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection
      component: redis
  template:
    metadata:
      labels:
        app: fraud-detection
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: fraud-detection
spec:
  selector:
    app: fraud-detection
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-api
  namespace: fraud-detection
spec:
  type: LoadBalancer
  selector:
    app: fraud-detection
    component: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
